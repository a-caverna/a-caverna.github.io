openapi: 3.1.0
info:
  title: Caverna API
  version: 1.0.0-alpha.1
  description: Contrato inicial planejado. Endpoints ainda não implementados.
servers:
  - url: https://api.example.invalid/api/v1
    description: Placeholder; substituir após definir o gateway de produção.
security:
  - bearerAuth: []
paths:
  /profile:
    get:
      summary: Consultar perfil do usuário autenticado
      operationId: getProfile
      responses:
        '200':
          description: Perfil retornado
        '401':
          description: Não autenticado
  /accountability/closures:
    get:
      summary: Consultar fechamentos diários
      operationId: listDailyClosures
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200': { description: Fechamentos retornados }
        '401': { description: Não autenticado }
  /context/current:
    get:
      summary: Consultar contexto atual
      operationId: getCurrentContext
      responses:
        '200': { description: Contexto atual retornado }
        '401': { description: Não autenticado }
  /evolution/summary:
    get:
      summary: Consultar resumo de evolução
      operationId: getEvolutionSummary
      responses:
        '200': { description: Indicadores de evolução retornados }
        '401': { description: Não autenticado }
  /showcase/exports:
    post:
      summary: Solicitar exportação de um relatório compartilhável
      operationId: createShowcaseExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template, format, periodStart, periodEnd]
              properties:
                template: { type: string, enum: [monthly-recap, evolution-report, achievement] }
                format: { type: string, enum: [story, feed, square] }
                periodStart: { type: string, format: date }
                periodEnd: { type: string, format: date }
                selectedMetrics: { type: array, items: { type: string } }
                includePhotos: { type: boolean, default: false }
      responses:
        '202': { description: Exportação aceita para processamento }
        '400': { description: Solicitação inválida }
        '401': { description: Não autenticado }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
